<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chambrelan · Gestion de stock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='rgb(27,58,84)'/><text x='50' y='70' font-size='58' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'>C</text></svg>">
<style>
/* ============ TOKENS ============ */
:root{
  --navy-950:#0f2438;
  --navy-800:#173a56;
  --blue-700:#1f5a89;
  --blue-600:#2b6ca3;
  --blue-500:#3f84bd;
  --blue-100:#e6f0f8;
  --teal-600:#0e7c86;
  --teal-100:#e2f4f4;
  --violet-600:#6d4aa8;
  --violet-100:#ece3f7;
  --slate-600:#51677a;
  --slate-100:#e6ebf0;
  --steel-50:#f4f7f9;
  --white:#ffffff;
  --ink-900:#182430;
  --ink-600:#4c5c6b;
  --ink-400:#8394a3;
  --line:#dbe4ec;
  --line-soft:#eaf0f5;
  --amber-700:#a3630a;
  --amber-500:#c77d0a;
  --amber-100:#fbebd2;
  --green-700:#166a49;
  --green-500:#1f8a5f;
  --green-100:#dff3e8;
  --red-700:#a3382a;
  --red-500:#c0392b;
  --red-100:#fbe7e4;
  --radius:8px;
  --radius-lg:12px;
  --shadow:0 1px 2px rgba(15,36,56,.06), 0 6px 20px rgba(15,36,56,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--steel-50);
  color:var(--ink-900);
  font-size:14.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
h1,h2,h3{margin:0;}
table{border-collapse:collapse;width:100%;}
::selection{background:var(--blue-100);}
:focus-visible{outline:2.5px solid var(--blue-500); outline-offset:2px;}

/* ============ LAYOUT ============ */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:linear-gradient(180deg,var(--navy-950),var(--navy-800) 130%);
  color:var(--white);
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{flex:none;}
.brand-title{display:flex;flex-direction:column;gap:1px;border-left:1px solid rgba(255,255,255,.25);padding-left:14px;}
.brand-title .app-name{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13.5px;color:#fff;}
.brand-title .app-sub{font-size:11.5px;color:rgba(255,255,255,.65);letter-spacing:.03em;}

.header-actions{display:flex;align-items:center;gap:8px;}
.conn-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(46,204,113,.16);border:1px solid rgba(46,204,113,.35);
  border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.9);
}
.conn-badge .dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;flex:none;}
.conn-badge.offline{background:rgba(224,75,63,.18);border-color:rgba(224,75,63,.4);}
.conn-badge.offline .dot{background:#e04b3f;}
.user-chip{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;
  border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer;
}
.user-chip:hover{background:rgba(255,255,255,.16);}

.setup-overlay{
  position:fixed;inset:0;background:rgba(15,36,56,.92);z-index:99999;
  display:none;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
}
.setup-card{
  background:#fff;border-radius:16px;max-width:640px;width:100%;padding:32px 34px;
  box-shadow:0 30px 80px rgba(0,0,0,.4);margin:auto;
}
.setup-card h2{font-size:19px;font-weight:800;color:var(--navy-800);margin-bottom:10px;}
.setup-card p{font-size:13.5px;color:var(--ink-600);line-height:1.55;margin:0 0 14px;}
.setup-card ol{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:11px;}
.setup-card li{font-size:13.5px;color:var(--ink-900);line-height:1.5;}
.setup-card code{
  background:var(--steel-50);border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;font-family:var(--mono);font-size:11.5px;display:inline-block;margin-top:4px;word-break:break-all;
}
.setup-hint{font-size:12px;color:var(--ink-400);font-style:italic;}

.stat-strip{display:flex;gap:10px;flex-wrap:wrap;}
.stat-chip{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  padding:6px 14px;
  display:flex;
  align-items:baseline;
  gap:6px;
  cursor:default;
}
.stat-chip b{font-size:15px;font-weight:800;}
.stat-chip span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.7);}
.stat-chip.alert{background:rgba(199,125,10,.22); border-color:rgba(199,125,10,.5); cursor:pointer;}
.stat-chip.alert b{color:#ffcf8a;}
.stat-chip.alert:hover{background:rgba(199,125,10,.34);}

.tabs{
  display:flex;
  gap:2px;
  background:var(--white);
  padding:0 22px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.tab-btn{
  border:none;background:none;
  padding:13px 18px 11px;
  font-weight:700;
  font-size:13px;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink-400);
  border-bottom:3px solid transparent;
  cursor:pointer;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--blue-600);}
.tab-btn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);}

main{flex:1;padding:20px 22px 60px;max-width:1320px;width:100%;margin:0 auto;}
.tab-panel{display:none;animation:fadein .18s ease;}
.tab-panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ============ TOOLBAR / CONTROLS ============ */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:14px;
}
.search-box{
  position:relative;flex:1 1 240px;min-width:200px;
}
.search-box input{
  width:100%;padding:9px 12px 9px 32px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--white);
}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45;}

.segmented{display:flex;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.segmented button{
  border:none;background:none;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink-600);
  cursor:pointer;border-right:1px solid var(--line);white-space:nowrap;
}
.segmented button:last-child{border-right:none;}
.segmented button.active{background:var(--blue-600);color:#fff;}

.check-inline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-600);font-weight:600;white-space:nowrap;padding:0 4px;}
.check-inline input{width:15px;height:15px;accent-color:var(--blue-600);}

.spacer{flex:1;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--white);
  color:var(--ink-900);
  padding:9px 14px;border-radius:var(--radius);
  font-weight:700;font-size:13px;cursor:pointer;
  transition:background .12s,border-color .12s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--blue-500);color:var(--blue-700);}
.btn-primary{background:var(--blue-600);border-color:var(--blue-600);color:#fff;}
.btn-primary:hover{background:var(--blue-700);border-color:var(--blue-700);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--blue-100);}
.btn-danger{color:var(--red-600);}
.btn-danger:hover{background:var(--red-100);border-color:var(--red-500);color:var(--red-700);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ============ CARD / TABLE ============ */
.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;
}
.table-wrap{overflow-x:auto;}
table.data th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-400);font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);
  background:var(--steel-50);white-space:nowrap;
}
table.data th.sortable{cursor:pointer;user-select:none;}
table.data th.sortable:hover{color:var(--blue-600);}
table.data td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.data tbody tr:hover{background:var(--blue-100);}
table.data tbody tr.row-low{background:var(--amber-100);}
table.data tbody tr.row-low:hover{background:#f7e3bd;}
.empty-row td{padding:46px 14px;text-align:center;color:var(--ink-400);}
.empty-row .empty-cta{margin-top:10px;}

.ref-code{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.01em;}
.cell-ref{display:flex;align-items:center;gap:8px;}
.badge{
  display:inline-block;padding:3px 8px;border-radius:5px;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;flex:none;
}
.badge-meca{background:var(--blue-100);color:var(--blue-700);}
.badge-glissiere{background:var(--teal-100);color:var(--teal-600);}
.badge-bille{background:var(--violet-100);color:var(--violet-600);}
.badge-cage{background:var(--slate-100);color:var(--slate-600);}
.badge-entree{background:var(--green-100);color:var(--green-700);}
.badge-sortie{background:var(--red-100);color:var(--red-700);}
.badge-correction{background:var(--amber-100);color:var(--amber-700);}

.tag-warning{
  display:inline-flex;align-items:center;gap:4px;margin-left:8px;
  background:var(--amber-500);color:#fff;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;
}
.qty-value{font-weight:800;font-size:14.5px;}
.cell-actions{display:flex;gap:6px;justify-content:flex-end;}
.mono-small{font-family:var(--mono);font-size:12px;color:var(--ink-600);}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-800);}
.section-head .totals{font-size:12.5px;color:var(--ink-600);font-weight:600;}

/* ============ INVENTAIRE HEADER ============ */
.inv-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.inv-summary{display:flex;gap:10px;flex-wrap:wrap;}
.inv-actions{display:flex;gap:8px;flex-wrap:wrap;}
.summary-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 16px;min-width:120px;
}
.summary-card b{display:block;font-size:20px;font-weight:800;color:var(--navy-800);}
.summary-card span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-400);font-weight:700;}

/* ============ DIALOGS ============ */
dialog{
  border:none;border-radius:var(--radius-lg);padding:0;width:min(460px,92vw);
  box-shadow:0 20px 60px rgba(15,36,56,.35);
}
dialog::backdrop{background:rgba(15,36,56,.55);}
.dialog-head{
  padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.dialog-head h3{font-size:15px;font-weight:800;color:var(--navy-800);}
.dialog-head button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-400);line-height:1;padding:4px;}
.dialog-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;}
.dialog-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--ink-600);}
.field .hint{font-size:11px;color:var(--ink-400);font-weight:500;}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;background:var(--white);
}
.field textarea{resize:vertical;min-height:60px;}
.field.error input,.field.error select{border-color:var(--red-500);}
.field-error-msg{font-size:11.5px;color:var(--red-600);font-weight:700;display:none;}
.field.error .field-error-msg{display:block;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ref-context{
  background:var(--steel-50);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;display:flex;flex-direction:column;gap:2px;
}
.ref-context .rc-code{font-family:var(--mono);font-weight:800;font-size:14px;color:var(--navy-800);}
.ref-context .rc-desig{font-size:12.5px;color:var(--ink-600);}
.result-preview{
  font-size:13px;font-weight:700;color:var(--blue-700);background:var(--blue-100);
  border-radius:var(--radius);padding:8px 12px;
}
.result-preview.negative{color:var(--red-700);background:var(--red-100);}

/* ============ TOASTS ============ */
#toast-container{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none;max-height:80vh;overflow:hidden;}
.toast{
  background:var(--navy-900,#182430);color:#fff;padding:11px 16px;border-radius:8px;
  font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;animation:toastin .15s ease;max-width:320px;
}
.toast.success{background:var(--green-700);}
.toast.error{background:var(--red-700);}
.toast.info{background:var(--navy-800);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ============ FOOTER ============ */
footer.app-footer{
  text-align:center;font-size:11.5px;color:var(--ink-400);padding:18px 22px 30px;
}

/* ============ PRINT ============ */
.print-only{display:none;}
@media print{
  .topbar,.tabs,.toolbar,.inv-toolbar .inv-actions,footer.app-footer,dialog,#toast-container,.cell-actions,.section-head .subtitle-actions{display:none !important;}
  main{padding:0;max-width:100%;}
  .print-only{display:block;}
  .card{box-shadow:none;border:1px solid #999;}
  body{background:#fff;font-size:11.5px;}
  table.data th{background:#eee !important;color:#111 !important;}
  .tag-warning{background:#666 !important;}
  .print-header{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid #163a56;padding-bottom:10px;margin-bottom:16px;
  }
  .print-header .ph-title{font-size:18px;font-weight:800;color:#163a56;}
  .print-header .ph-date{font-size:12px;color:#444;}
  .tab-panel{display:none !important;}
  .tab-panel.active{display:block !important;}
}

@media (max-width:720px){
  .two-col{grid-template-columns:1fr;}
  .topbar{padding:12px 14px;}
  main{padding:16px 14px 50px;}
  .tabs{padding:0 14px;}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" width="180" height="46" viewBox="0 0 300 76" xmlns="http://www.w3.org/2000/svg" aria-label="Chambrelan">
        <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" font-size="38" letter-spacing="-1" fill="#ffffff">CHAMBRELAN</text>
        <polygon points="0,50 205,50 205,58 0,58" fill="#5b93c4"/>
        <polygon points="205,42 205,66 245,54" fill="#5b93c4"/>
      </svg>
      <div class="brand-title">
        <span class="app-name">Gestion de stock</span>
        <span class="app-sub">Pièces mécaniques &amp; glissières</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="conn-badge" id="connBadge"><span class="dot"></span><span class="conn-text">Connexion…</span></div>
      <button type="button" class="user-chip" id="userChip">👤 Définir un nom</button>
    </div>
    <div class="stat-strip" id="statStrip"></div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="references">Références</button>
    <button class="tab-btn" data-tab="historique">Historique</button>
    <button class="tab-btn" data-tab="inventaire">Inventaire</button>
  </nav>

  <main>

    <!-- ============ ONGLET REFERENCES ============ -->
    <section class="tab-panel active" id="tab-references">
      <div class="toolbar">
        <button class="btn btn-primary" id="btnNewRef">+ Nouvelle référence</button>
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8394a3" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="refSearch" placeholder="Rechercher une référence, désignation, emplacement…">
        </div>
        <div class="segmented" id="refCatFilter">
          <button class="active" data-cat="all">Toutes</button>
          <button data-cat="meca">Pièces mécaniques</button>
          <button data-cat="glissiere">Glissières</button>
          <button data-cat="bille">Billes</button>
          <button data-cat="cage">Cages</button>
        </div>
        <label class="check-inline"><input type="checkbox" id="refLowStockOnly"> Stock bas uniquement</label>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th class="sortable" data-sort="ref">Référence</th>
                <th class="sortable" data-sort="designation">Désignation</th>
                <th>Emplacement</th>
                <th class="sortable" data-sort="quantity">Quantité</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="refTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ============ ONGLET HISTORIQUE ============ -->
    <section class="tab-panel" id="tab-historique">
      <div class="toolbar">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8394a3" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="histSearch" placeholder="Rechercher par référence ou désignation…">
        </div>
        <div class="segmented" id="histTypeFilter">
          <button class="active" data-type="all">Tous</button>
          <button data-type="entree">Entrées</button>
          <button data-type="sortie">Sorties</button>
          <button data-type="correction">Corrections</button>
        </div>
        <div class="spacer"></div>
        <button class="btn" id="btnExportHistCsv">Exporter CSV</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Date</th>
                <th>Référence</th>
                <th>Désignation</th>
                <th>Catégorie</th>
                <th>Type</th>
                <th>Quantité</th>
                <th>Stock résultant</th>
                <th>Auteur</th>
                <th>Motif</th>
              </tr>
            </thead>
            <tbody id="histTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ============ ONGLET INVENTAIRE ============ -->
    <section class="tab-panel" id="tab-inventaire">
      <div class="print-header print-only">
        <div class="ph-title">CHAMBRELAN — Fiche d'inventaire</div>
        <div class="ph-date" id="printDate"></div>
      </div>

      <div class="inv-toolbar">
        <div class="inv-summary" id="invSummary"></div>
        <div class="inv-actions">
          <button class="btn" id="btnBackupExport">Sauvegarder (JSON)</button>
          <button class="btn" id="btnBackupImport">Restaurer (JSON)</button>
          <input type="file" id="fileImport" accept="application/json" style="display:none;">
          <button class="btn" id="btnExportInvCsv">Exporter CSV</button>
